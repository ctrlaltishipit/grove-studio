<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grove Studio</title>
    <meta name="description" content="Write together, or write apart and see what you all noticed." />
    <!-- Brand (A17). The SVG favicon recolours with the OS theme; the PNGs are
         for Safari's tab, the iOS home screen and the Android manifest. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Grove" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1917" />
    <meta property="og:title" content="Grove Studio" />
    <meta property="og:description" content="Write together, or write apart and see what you all noticed." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.grovestudio.io/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <script>
      /* Theme before first paint so dark users never see a light flash.
         data-theme absent = follow the system. GROVE-MASTER.md §9.2 */
      try {
        var t = localStorage.getItem('grove:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
